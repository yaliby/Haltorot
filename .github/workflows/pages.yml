# Builds app/ and publishes it to GitHub Pages on every push to the default
# branch. Turn it on once in Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [yaliby]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling the build
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # supabase-js wants a native WebSocket, which is Node 22 and up.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Build
        env:
          # The site lives under https://<user>.github.io/Haltorot/. The
          # Supabase settings come from app/.env.production, in the repo, so
          # this build needs nothing configured anywhere.
          BASE_PATH: /Haltorot/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub Pages is only files. Chart import needs a hop that can read Tab4U
  # and Ultimate Guitar; that hop is the project's Supabase Edge Function.
  # The token is a personal access token from
  # https://supabase.com/dashboard/account/tokens — not the secret key.
  import-fn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Deploy chart importer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set — skipping importer deploy."
            echo "Add it at Settings → Secrets and variables → Actions, then re-run."
            exit 0
          fi
          npm run fn:deploy
